[theme]
primaryColor = "#10a37f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f8"
textColor = "#0d0d0d"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# 배포(Streamlit Cloud)에서는 플랫폼이 바인딩을 관리하므로 address를 고정하지 않는다.
# 로컬에서 실무(고객 재무자료)로 쓸 때는 아래 줄의 주석을 해제해 외부 접근을 차단하세요.
# address = "127.0.0.1"
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 200
